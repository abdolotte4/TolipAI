    <!-- Canonical redirect: www → non-www; strip legacy ?page_id= params -->
    <script>
      (function () {
        var loc = window.location;
        var host = loc.hostname;
        var canonical = 'tolipai.com';
        var target = null;

        if (host === 'www.' + canonical) {
          target = 'https://' + canonical + loc.pathname + loc.search + loc.hash;
        } else if (/[?&]page_id=/.test(loc.search)) {
          var params = new URLSearchParams(loc.search);
          params.delete('page_id');
          var qs = params.toString();
          target = 'https://' + canonical + loc.pathname + (qs ? '?' + qs : '') + loc.hash;
        }

        if (target) {
          if (host === canonical) {
            history.replaceState(null, '', target);
          } else {
            window.location.replace(target);
          }
        }
      })();
    </script>
