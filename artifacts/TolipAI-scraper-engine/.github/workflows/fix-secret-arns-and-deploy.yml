name: Fix Secret ARNs and Deploy to ECS
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER: TolipAI-scraper-cluster
  SERVICE: tolipai-scraper-engine-service-xop
  TASK_FAMILY: tolipai-scraper-engine

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check which secrets exist in AWS
        run: |
          SECRETS=(
            "database-url" "webscraper-key" "jwt-secret" "openai-api-key"
            "brightdata-username" "brightdata-password"
            "oxylabs-username" "oxylabs-password"
            "propelio-email" "propelio-password"
            "propwire-email" "propwire-password"
            "google-maps-key" "redis-url" "s3-cache-bucket"
          )
          MISSING=()
          for secret in "${SECRETS[@]}"; do
            echo -n "Checking TolipAI/scraper/$secret... "
            if aws secretsmanager describe-secret --secret-id "TolipAI/scraper/$secret" >/dev/null 2>&1; then
              echo "EXISTS"
            else
              echo "MISSING"
              MISSING+=("$secret")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "❌ MISSING SECRETS: ${MISSING[*]}"
            echo "Run 'Create Missing Secrets in AWS' workflow first!"
            exit 1
          fi
          echo ""
          echo "✅ All secrets exist!"

      - name: Get correct ARNs and update task definition
        run: |
          python3 << 'PYEOF'
          import json
          import subprocess
          import sys

          secret_mapping = {
              "DATABASE_URL": "database-url",
              "SCRAPER_API_KEY": "webscraper-key",
              "JWT_SECRET": "jwt-secret",
              "OPENAI_API_KEY": "openai-api-key",
              "BRIGHTDATA_USERNAME": "brightdata-username",
              "BRIGHTDATA_PASSWORD": "brightdata-password",
              "OXYLABS_USERNAME": "oxylabs-username",
              "OXYLABS_PASSWORD": "oxylabs-password",
              "PROPELIO_EMAIL": "propelio-email",
              "PROPELIO_PASSWORD": "propelio-password",
              "PROPWIRE_EMAIL": "propwire-email",
              "PROPWIRE_PASSWORD": "propwire-password",
              "GOOGLE_MAPS_API_KEY": "google-maps-key",
              "REDIS_URL": "redis-url",
              "S3_CACHE_BUCKET": "s3-cache-bucket",
          }

          secrets = {}
          for env_name, secret_name in secret_mapping.items():
              try:
                  result = subprocess.run(
                      ["aws", "secretsmanager", "describe-secret",
                       "--secret-id", f"TolipAI/scraper/{secret_name}",
                       "--query", "ARN",
                       "--output", "text"],
                      capture_output=True, text=True, check=True
                  )
                  secrets[env_name] = result.stdout.strip()
                  print(f"✅ {env_name}: {secrets[env_name]}")
              except subprocess.CalledProcessError as e:
                  print(f"❌ ERROR: {secret_name}: {e.stderr}")
                  sys.exit(1)

          with open("infrastructure/ecs-task-definition.json", "r") as f:
              task_def = json.load(f)

          for secret in task_def["containerDefinitions"][0]["secrets"]:
              env_name = secret["name"]
              if env_name in secrets:
                  secret["valueFrom"] = secrets[env_name]

          with open("infrastructure/ecs-task-definition.json", "w") as f:
              json.dump(task_def, f, indent=2)
              f.write("\n")

          print("\n✅ Task definition updated with correct ARNs!")
          PYEOF

      - name: Commit updated task definition
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add infrastructure/ecs-task-definition.json
          git diff --cached --quiet || git commit -m "Auto-fix: Update secret ARNs with correct suffixes"
          git push || echo "No changes to push"

      - name: Stop old tasks and set desired count
        run: |
          echo "=== Stopping old tasks ==="
          TASKS=$(aws ecs list-tasks --cluster ${{ env.CLUSTER }} --desired-status RUNNING --query 'taskArns[]' --output text)
          if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
            for task in $TASKS; do
              aws ecs stop-task --cluster ${{ env.CLUSTER }} --task "$task" --reason "Replacing with fixed task definition"
            done
          fi
          echo "=== Setting desired count to 1 ==="
          aws ecs update-service --cluster ${{ env.CLUSTER }} --service ${{ env.SERVICE }} --desired-count 1

      - name: Register new task definition and deploy
        run: |
          echo "=== Registering new task definition ==="
          aws ecs register-task-definition --cli-input-json file://infrastructure/ecs-task-definition.json
          echo "=== Updating service with new task definition ==="
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service ${{ env.SERVICE }} \
            --task-definition ${{ env.TASK_FAMILY }} \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          echo "=== Waiting for service to stabilize (up to 10 minutes) ==="
          aws ecs wait services-stable --cluster ${{ env.CLUSTER }} --services ${{ env.SERVICE }} || echo "Timeout waiting for stability"

      - name: Verify deployment
        run: |
          echo "=== Service status ==="
          aws ecs describe-services --cluster ${{ env.CLUSTER }} --services ${{ env.SERVICE }} \
            --query 'services[0].{status:status, runningCount:runningCount, desiredCount:desiredCount, pendingCount:pendingCount, events:events[:3]}'
          echo ""
          echo "=== Running tasks ==="
          aws ecs list-tasks --cluster ${{ env.CLUSTER }} --desired-status RUNNING --query 'taskArns[]'
          echo ""
          echo "=== Testing /health endpoint ==="
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" http://tolip-scraper-url-323311724.us-east-1.elb.amazonaws.com:8765/health || echo "Health check not ready yet"
