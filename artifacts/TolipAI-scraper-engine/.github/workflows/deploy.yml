name: Deploy to ECS Fargate

on:
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'Dockerfile.fargate'
      - 'Dockerfile.base'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'infrastructure/ecs-task-definition.json'
      - 'start.fargate.sh'

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git SHA)'
        required: false
        default: ''
      force_rebuild_base:
        description: 'Force rebuild the base image'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tolipai-scraper
  ECR_BASE_REPOSITORY: tolipai-scraper-base
  ECS_CLUSTER: TolipAI-scraper-cluster
  ECS_SERVICE: tolipai-scraper-engine-service-xop
  TASK_DEFINITION: infrastructure/ecs-task-definition.json
  CONTAINER_NAME: scraper

jobs:
  deploy:
    name: Build, Push & Deploy (AMD64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: image-tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if base image exists and is correct platform
        id: check-base
        env:
          BASE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
        run: |
          NEED_BUILD="true"
          if [ "${{ github.event.inputs.force_rebuild_base }}" != "true" ] && docker pull "$BASE" 2>/dev/null; then
            PLATFORM=$(docker inspect --format='{{.Os}}/{{.Architecture}}' "$BASE" 2>/dev/null || echo "unknown")
            echo "Base image platform: $PLATFORM"
            if [ "$PLATFORM" = "linux/amd64" ]; then
              echo "Base image OK (linux/amd64)"
              NEED_BUILD="false"
            else
              echo "Base image is $PLATFORM, need linux/amd64"
            fi
          else
            echo "Base image not found or force rebuild"
          fi
          echo "need_build=$NEED_BUILD" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        if: steps.check-base.outputs.need_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,mode=max,scope=base-amd64

      - name: Build and push app image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fargate
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=deploy-amd64
          cache-to: type=gha,mode=max,scope=deploy-amd64

      - name: Substitute ACCOUNT_ID in task definition
        run: |
          sed "s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" \
            ${{ env.TASK_DEFINITION }} > /tmp/task-def-resolved.json

      - name: Update image URI in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def-resolved.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

      - name: Register task definition and update ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Summary
        run: |
          echo "### Scraper Engine Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Base image | \`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform  | \`linux/amd64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster   | \`${{ env.ECS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Service   | \`${{ env.ECS_SERVICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region    | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
