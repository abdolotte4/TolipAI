name: Auto-Fix Ruff Lint and Deploy
on:
  workflow_dispatch:

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Auto-fix ruff errors
        run: |
          echo "=== Running ruff check --fix ==="
          ruff check workers/ --fix
          echo ""
          echo "=== Running ruff format ==="
          ruff format workers/

      - name: Commit fixes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-fix: ruff lint and format"
          git push || echo "No changes to push"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs register-task-definition --cli-input-json file://infrastructure/ecs-task-definition.json
          aws ecs update-service \
            --cluster TolipAI-scraper-cluster \
            --service tolipai-scraper-engine-service-xop \
            --task-definition tolipai-scraper-engine \
            --force-new-deployment
