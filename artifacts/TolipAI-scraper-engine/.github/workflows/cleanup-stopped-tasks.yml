name: Cleanup Stopped ECS Tasks + Fix vCPU
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER: TolipAI-scraper-cluster
  SERVICE: tolipai-scraper-engine-service-xop

jobs:
  cleanup-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── Step 1: Stop all RUNNING tasks to free vCPU ───────────────────────
      - name: Stop all running tasks
        run: |
          echo "=== Listing all RUNNING tasks on cluster ==="
          TASKS=$(aws ecs list-tasks --cluster ${{ env.CLUSTER }} --desired-status RUNNING --query 'taskArns[]' --output text)
          if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
            echo "Stopping tasks: $TASKS"
            for task in $TASKS; do
              aws ecs stop-task --cluster ${{ env.CLUSTER }} --task "$task" --reason "Cleanup for vCPU quota"
              echo "Stopped: $task"
            done
          else
            echo "No running tasks found."
          fi

      # ─── Step 2: Set service desired count to 0 (no new tasks) ────────────
      - name: Set service desired count to 0
        run: |
          echo "=== Setting service desired count to 0 ==="
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service ${{ env.SERVICE }} \
            --desired-count 0
          echo "Service set to desired-count=0. No new tasks will be scheduled."

      # ─── Step 3: Verify nothing is running ────────────────────────────────
      - name: Verify cleanup
        run: |
          echo "=== Waiting 30 seconds for tasks to stop ==="
          sleep 30
          echo "=== Running tasks after cleanup ==="
          aws ecs list-tasks --cluster ${{ env.CLUSTER }} --desired-status RUNNING --query 'taskArns[]'
          echo "=== Service status ==="
          aws ecs describe-services --cluster ${{ env.CLUSTER }} --services ${{ env.SERVICE }} --query 'services[0].{status:status, runningCount:runningCount, desiredCount:desiredCount}'
          echo ""
          echo "✅ vCPU cleanup complete. You can now manually deploy when ready."
          echo "   To deploy: Go to Actions → Deploy to ECS Fargate → Run workflow"
