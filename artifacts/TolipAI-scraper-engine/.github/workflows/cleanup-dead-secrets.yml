name: Cleanup Dead Secrets
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Delete dead / unused secrets (force, no recovery)
        run: |
          # Dead provider secrets (code removed these providers)
          DEAD_SECRETS=(
            "TolipAI/scraper/OPENROUTER_KEY"
            "TolipAI/scraper/GROQ_KEY"
            "TolipAI/scraper/MOONSHOT_KEY"
            "TolipAI/scraper/NVIDIA_KEY"
            "TolipAI/scraper/CEREBRAS_KEY"
            "TolipAI/scraper/GEMINI_KEY"
          )

          # Not used by scraper code (hardcoded defaults or not referenced)
          UNUSED_SECRETS=(
            "TolipAI/scraper/OPENAI_BASE_URL"
            "TolipAI/scraper/AI_MODEL"
            "TolipAI/scraper/BRIGHTDATA_API"
            "TolipAI/scraper/PROXY_HOST"
            "TolipAI/scraper/PEOPLEDATALABS_KEY"
          )

          # ATTOM keys — used by CRM, not scraper engine
          ATTOM_SECRETS=(
            "TolipAI/scraper/ATTOM_API_KEY"
            "TolipAI/scraper/ATTOM_API_KEY_2"
          )

          # Lowercase duplicates that conflict with uppercase working secrets
          LOWERCASE_DUPLICATES=(
            "TolipAI/scraper/jwt-secret"
            "TolipAI/scraper/openai-key"
            "TolipAI/scraper/attom-key"
            "TolipAI/scraper/attom-key-2"
            "TolipAI/scraper/database-url"
            "TolipAI/scraper/redis-url"
            "TolipAI/scraper/cerebras-key"
            "TolipAI/scraper/gemini-key"
            "TolipAI/scraper/peopledatalabs-key"
          )

          ALL_SECRETS=("${DEAD_SECRETS[@]}" "${UNUSED_SECRETS[@]}" "${ATTOM_SECRETS[@]}" "${LOWERCASE_DUPLICATES[@]}")

          for SEC in "${ALL_SECRETS[@]}"; do
            if aws secretsmanager describe-secret --secret-id "$SEC" --region us-east-1 >/dev/null 2>&1; then
              echo "Deleting: $SEC"
              aws secretsmanager delete-secret \
                --secret-id "$SEC" \
                --force-delete-without-recovery \
                --region us-east-1
              echo "✓ Deleted: $SEC"
            else
              echo "Not found: $SEC"
            fi
          done

          echo ""
          echo "Cleanup complete. Remaining secrets in TolipAI/scraper/:"
          aws secretsmanager list-secrets \
            --filter Key=name,Values=TolipAI/scraper/ \
            --query 'SecretList[].Name' --output table --region us-east-1
