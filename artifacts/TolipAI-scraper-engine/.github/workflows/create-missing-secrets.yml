name: Create Missing Secrets in AWS
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  create-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create database-url secret
        run: |
          aws secretsmanager create-secret \
            --name TolipAI/scraper/database-url \
            --description "Neon PostgreSQL database URL for scraper engine" \
            --secret-string '${{ secrets.DATABASE_URL }}' \
            || echo "Secret already exists, skipping"

      - name: Create jwt-secret secret
        run: |
          aws secretsmanager create-secret \
            --name TolipAI/scraper/jwt-secret \
            --description "JWT signing secret for scraper engine" \
            --secret-string '${{ secrets.JWT_SECRET }}' \
            || echo "Secret already exists, skipping"

      - name: Create openai-api-key secret
        run: |
          aws secretsmanager create-secret \
            --name TolipAI/scraper/openai-api-key \
            --description "OpenAI API key for scraper engine" \
            --secret-string '${{ secrets.OPENAI_API_KEY }}' \
            || echo "Secret already exists, skipping"

      - name: Create redis-url secret
        run: |
          aws secretsmanager create-secret \
            --name TolipAI/scraper/redis-url \
            --description "Redis connection URL for scraper engine" \
            --secret-string '${{ secrets.REDIS_URL }}' \
            || echo "Secret already exists, skipping"

      - name: Verify secrets created
        run: |
          echo "=== Verifying all secrets exist ==="
          for secret in database-url jwt-secret openai-api-key redis-url; do
            aws secretsmanager describe-secret --secret-id TolipAI/scraper/$secret
          done
