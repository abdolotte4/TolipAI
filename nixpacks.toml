# Do NOT add python311/pip to nixPkgs — nixpacks auto-detects Python and manages
# its own venv. Adding Nix-managed Python causes "externally-managed-environment"
# errors when pip tries to install packages (PEP 668 / Nix immutable store).
#
# We only add the system-level shared libraries that Chromium/Playwright needs.

[phases.setup]
nixPkgs = [
  "glib",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "mesa",
  "pango",
  "cairo",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "alsa-lib",
]

# Explicitly install from requirements.railway.txt (renamed to prevent
# Replit's publisher from auto-detecting it and failing on the read-only Nix store).
[phases.install]
cmds = ["pip install -r requirements.railway.txt"]

[phases.build]
cmds = ["playwright install chromium || true"]
