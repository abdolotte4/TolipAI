[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "glib",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "mesa",
  "pango",
  "cairo",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "alsa-lib",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
# This MUST run during build, not start, to persist the browser
cmds = ["playwright install --with-deps chromium"]

[start]
cmd = "uvicorn workers.main:app --host 0.0.0.0 --port 3000"
