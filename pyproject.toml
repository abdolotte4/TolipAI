[project]
name = "TolipAI-workspace"
version = "0.1.0"
description = "TolipAI scraper engine workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.14.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "boto3>=1.43.14",
    "botocore>=1.43.14",
    "fastapi>=0.136.3",
    "homeharvest>=0.8.18",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openai>=2.41.0",
    "pandas>=3.0.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "usaddress>=0.5.16",
    "uvicorn>=0.49.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
