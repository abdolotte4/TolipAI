[project]
name = "TolipAI-workspace"
version = "0.1.0"
description = "TolipAI scraper engine workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "homeharvest>=0.8.18",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "openai>=2.34.0",
    "pandas>=2.3.3",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.2.0",
    "playwright>=1.59.0",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "tenacity>=9.1.4",
    "usaddress>=0.5.16",
    "uvicorn>=0.46.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
