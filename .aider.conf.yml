## Aider configuration for Digor LLC monorepo
## Run: ./launch-aider.sh
##
## Primary: Kimi K2.6 (Moonshot) — 1M token context, 200K input, agent swarm capable
## Fallback: Groq (free, fast)
##
## Set API keys in Replit Secrets:
##   MOONSHOT_KIMI_API_KEY  — https://platform.moonshot.ai  (direct, most powerful)
##   OPENROUTER_API_KEY     — https://openrouter.ai          (kimi-k2.6 via proxy)
##   GROQ_API_KEY           — https://console.groq.com       (free fallback)

# ── Primary model: Kimi K2.6 via OpenRouter ───────────────────────────────────
# The launch script overrides this with direct Moonshot if MOONSHOT_KIMI_API_KEY is set.
model: openrouter/moonshotai/kimi-k2.6

# Weak model: Groq (free, used for repo-map summaries and cheap tasks)
weak-model: groq/llama-3.1-8b-instant

# ── Repo map ──────────────────────────────────────────────────────────────────
# Kimi K2.6 has 1M token context — use a generous repo map
map-tokens: 8192

# ── Context: always load project docs as read-only ───────────────────────────
read:
  - CONVENTIONS.md
  - docs/agent-chat-context.md

# ── Cost / caching ────────────────────────────────────────────────────────────
cache-prompts: true
no-show-model-warnings: true

# ── Git ───────────────────────────────────────────────────────────────────────
attribute-author: false
attribute-committer: false
