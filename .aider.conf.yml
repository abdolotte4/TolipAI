## Aider configuration for Digor LLC monorepo
## Run: ./launch-aider.sh   (sets up API key automatically)
##
## Model priority (cheapest/free first):
##   1. Groq  — free, fast (set GROQ_API_KEY in Replit Secrets)
##   2. OpenRouter free models — limited credits, small context only
##   3. OpenRouter paid — set OPENROUTER_API_KEY + add credits
##
## The launch script picks the right model automatically based on env vars.

# ── Model ─────────────────────────────────────────────────────────────────────
# Default: Groq (free). Launch script overrides this if only OpenRouter is set.
model: groq/llama-3.3-70b-versatile

# Weak model used for lightweight tasks (repo map summaries, etc.)
weak-model: groq/llama-3.1-8b-instant

# ── Repo map ──────────────────────────────────────────────────────────────────
# Tokens used to build the map of your whole project.
# Keep low (1024) for free/limited accounts. Raise to 4096 if you have credits.
map-tokens: 1024

# ── Context ───────────────────────────────────────────────────────────────────
# Always load these files as read-only context every session
read:
  - CONVENTIONS.md
  - docs/agent-chat-context.md

# ── Cost / caching ────────────────────────────────────────────────────────────
cache-prompts: true

# ── Git ───────────────────────────────────────────────────────────────────────
attribute-author: false
attribute-committer: false
