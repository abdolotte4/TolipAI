name: Build Scraper Base Image

on:
  schedule:
    - cron: '0 0 * * 0'   # Weekly on Sunday
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacts/TolipAI-scraper-engine/Dockerfile.base'
      - 'artifacts/TolipAI-scraper-engine/requirements.lock'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tolipai-scraper-base

jobs:
  build-base:
    name: Build & Push Base Image (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (ARM64)
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: artifacts/TolipAI-scraper-engine
          file: artifacts/TolipAI-scraper-engine/Dockerfile.base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=base-arm64
          cache-to: type=gha,mode=max,scope=base-arm64
