name: Deploy to ECS Fargate

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/TolipAI-scraper-engine/workers/**'
      - 'artifacts/TolipAI-scraper-engine/Dockerfile.fargate'
      - 'artifacts/TolipAI-scraper-engine/Dockerfile.base'
      - 'artifacts/TolipAI-scraper-engine/requirements.txt'
      - 'artifacts/TolipAI-scraper-engine/requirements.lock'
      - 'artifacts/TolipAI-scraper-engine/infrastructure/ecs-task-definition.json'
      - 'artifacts/TolipAI-scraper-engine/start.fargate.sh'

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git SHA)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tolipai-scraper
  ECR_BASE_REPOSITORY: tolipai-scraper-base
  ECS_CLUSTER: TolipAI-scraper-cluster
  ECS_SERVICE: tolipai-scraper-engine-service-xop
  TASK_DEFINITION: artifacts/TolipAI-scraper-engine/infrastructure/ecs-task-definition.json
  CONTAINER_NAME: scraper

jobs:
  deploy:
    name: Build, Push & Deploy (ARM64)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionsECRPush
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: image-tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for ARM64 on AMD64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx (ARM64)
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64
          driver: docker

      - name: Pull or build base image
        run: |
          BASE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest"
          if docker pull "$BASE" 2>/dev/null; then
            echo "Base image pulled successfully."
          else
            echo "Base image not found in ECR — building with buildx (ARM64 via QEMU)..."
            docker buildx build -f artifacts/TolipAI-scraper-engine/Dockerfile.base --platform linux/arm64 -t "$BASE" --push artifacts/TolipAI-scraper-engine
            echo "Base image built and pushed."
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: artifacts/TolipAI-scraper-engine
          file: artifacts/TolipAI-scraper-engine/Dockerfile.fargate
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,mode=max,scope=deploy-arm64

      - name: Substitute ACCOUNT_ID in task definition
        run: |
          sed "s|ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" \
            ${{ env.TASK_DEFINITION }} > /tmp/task-def-resolved.json

      - name: Update image URI in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def-resolved.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

      - name: Register task definition and update ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        run: |
          echo "### Scraper Engine Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Base image | \`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform  | \`linux/arm64 (Graviton3)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster   | \`${{ env.ECS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Service   | \`${{ env.ECS_SERVICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region    | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
