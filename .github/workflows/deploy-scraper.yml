name: Deploy to ECS Fargate

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/TolipAI-scraper-engine/workers/**'
      - 'artifacts/TolipAI-scraper-engine/Dockerfile.fargate'
      - 'artifacts/TolipAI-scraper-engine/Dockerfile.base'
      - 'artifacts/TolipAI-scraper-engine/requirements.txt'
      - 'artifacts/TolipAI-scraper-engine/requirements.lock'
      - 'artifacts/TolipAI-scraper-engine/infrastructure/ecs-task-definition.json'
      - 'artifacts/TolipAI-scraper-engine/start.fargate.sh'
      - '.github/workflows/deploy-scraper.yml'

  workflow_dispatch:
    inputs:
      force_rebuild_base:
        description: 'Force rebuild the base image'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      image_tag:
        description: 'Image tag to deploy (defaults to git SHA)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tolipai-scraper
  ECR_BASE_REPOSITORY: tolipai-scraper-base
  ECS_CLUSTER: TolipAI-scraper-cluster
  ECS_SERVICE: tolipai-scraper-engine-service-xop
  TASK_DEFINITION: artifacts/TolipAI-scraper-engine/infrastructure/ecs-task-definition.json
  CONTAINER_NAME: scraper
  SCRAPER_DIR: artifacts/TolipAI-scraper-engine

jobs:
  deploy:
    name: Build, Push & Deploy (AMD64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: image-tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if base image exists and is correct platform
        id: check-base
        env:
          BASE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
        run: |
          NEED_BUILD="true"
          if [ "${{ github.event.inputs.force_rebuild_base }}" != "true" ] && docker pull "$BASE" 2>/dev/null; then
            PLATFORM=$(docker inspect --format='{{.Os}}/{{.Architecture}}' "$BASE" 2>/dev/null || echo "unknown")
            echo "Base image platform: $PLATFORM"
            if [ "$PLATFORM" = "linux/amd64" ]; then
              echo "Base image OK (linux/amd64)"
              NEED_BUILD="false"
            else
              echo "Base image is $PLATFORM, need linux/amd64 — will rebuild"
            fi
          else
            echo "Base image not found or force rebuild requested"
          fi
          echo "need_build=$NEED_BUILD" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        if: steps.check-base.outputs.need_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SCRAPER_DIR }}
          file: ${{ env.SCRAPER_DIR }}/Dockerfile.base
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,mode=max,scope=base-amd64

      - name: Build and push app image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SCRAPER_DIR }}
          file: ${{ env.SCRAPER_DIR }}/Dockerfile.fargate
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BASE_REPOSITORY }}:latest
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=deploy-amd64
          cache-to: type=gha,mode=max,scope=deploy-amd64

      - name: Update image in task definition and deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test — verify running task count
        run: |
          sleep 30
          RUNNING=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].runningCount' \
            --output text)
          echo "Running tasks: $RUNNING"
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount}' \
            --output table
          if [ "$RUNNING" -lt 1 ]; then
            echo "::error::No running tasks after deploy — fetching stopped-task diagnostics..."
            STOPPED=$(aws ecs list-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --desired-status STOPPED \
              --query 'taskArns[0]' \
              --output text 2>/dev/null || true)
            if [ -n "$STOPPED" ] && [ "$STOPPED" != "None" ]; then
              aws ecs describe-tasks \
                --cluster "${{ env.ECS_CLUSTER }}" \
                --tasks "$STOPPED" \
                --query 'tasks[0].containers[*].{name:name,exitCode:exitCode,reason:reason}' \
                --output table
            fi
            exit 1
          fi
          echo "✅ $RUNNING task(s) running"

      - name: Summary
        run: |
          echo "### Scraper Engine Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ steps.image-tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base rebuilt | \`${{ steps.check-base.outputs.need_build }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | \`linux/amd64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${{ env.ECS_CLUSTER }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`${{ env.ECS_SERVICE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | \`${{ env.AWS_REGION }}\` |" >> "$GITHUB_STEP_SUMMARY"
